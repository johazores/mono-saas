name: Feature request
description: Propose a focused reusable SaaS foundation improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Platform problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed reusable behavior
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Tenancy, provider, billing, storage, or domain-boundary considerations
